<script>
        // Simple script to handle tab switching
        function switchTab(tabId) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');
            const headerTitle = document.querySelector('h1');
            const headerDesc = document.querySelector('p.text-on-surface-variant');

            // Reset tab styles
            const inactiveClasses = ['text-on-surface-variant', 'hover:text-primary', 'bg-transparent', 'shadow-none', 'ring-0'];
            const activeClasses = ['bg-white', 'text-primary', 'shadow-sm', 'ring-1', 'ring-black/5'];

            loginTab.classList.remove(...activeClasses);
            loginTab.classList.add(...inactiveClasses);
            signupTab.classList.remove(...activeClasses);
            signupTab.classList.add(...inactiveClasses);

            if (tabId === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTab.classList.remove(...inactiveClasses);
                loginTab.classList.add(...activeClasses);
                headerTitle.textContent = 'Welcome Back';
                headerDesc.textContent = 'Continue your career journey.';
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                signupTab.classList.remove(...inactiveClasses);
                signupTab.classList.add(...activeClasses);
                headerTitle.textContent = 'Create Account';
                headerDesc.textContent = 'Start your AI guided interview prep.';
            }
        }
    </script>
